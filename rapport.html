<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapport — Hub Vie Spirituelle FER</title>
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="assets/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="shell">
  <header class="top">
    <img class="logo" src="assets/logo.jpg" alt="Logo FER">
    <div class="titles">
      <div class="eyebrow">Fondation Ecclesia Radiorum</div>
      <h1>Hub Vie Spirituelle</h1>
    </div>
  </header>

  <nav class="tabs">
    <a href="index.html">Aujourd'hui</a>
    <a href="rapport.html" class="active">Rapport</a>
  </nav>

  <div class="card" id="carte-connexion">
    <h2>Connexion</h2>
    <p class="hint">Connecte-toi pour consulter le rapport de la diaconie.</p>
    <div id="gsi-button"></div>
    <div id="session" class="session" style="display:none; margin-top:10px;">
      <div class="avatar" id="avatarInitiales"></div>
      <div class="who">Connecté·e en tant que <b id="nomSession"></b></div>
      <button class="link" id="btnDeconnexion">changer de compte</button>
    </div>
    <div class="msg warn" id="msgAuth"></div>
  </div>

  <div class="card" id="carte-mois" style="display:none;">
    <h2>Période à afficher</h2>
    <div class="month-row">
      <select id="selecteurPeriode">
        <option value="mois">Un mois précis</option>
        <option value="ag">Taux AG (1er oct au 31 mars)</option>
        <option value="annuel">Taux annuel (1er oct au 31 août)</option>
      </select>
      <select id="selecteurMois"></select>
      <select id="selecteurSaison" style="display:none;"></select>
      <button class="btn btn-secondary" id="btnActualiser">Actualiser</button>
    </div>
    <p class="hint" id="periodeHint" style="margin-top:10px;"></p>
  </div>

  <div class="card" id="carte-rapport" style="display:none;">
    <h2>Rapport par membre</h2>
    <div id="listePersonnes"></div>
  </div>

  <div class="card" id="carte-texte" style="display:none;">
    <h2>Version texte</h2>
    <pre id="texteRapport"></pre>
    <button class="btn btn-secondary" id="btnCopier" style="margin-top:12px;">Copier le texte</button>
  </div>

  <footer class="bas">Fondation Ecclesia Radiorum</footer>
</div>
<div class="toast" id="toast"></div>

<script src="assets/config.js"></script>
<script src="assets/rules.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/app-rapport.js"></script>
</body>
</html>
